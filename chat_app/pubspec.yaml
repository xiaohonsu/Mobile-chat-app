name: chat_app
description: "Chat App Demo - Simple to Advanced | Flutter & Dart Seminar"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State Management (Level 2)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Local Storage / Offline (Level 2)
  hive_flutter: ^1.1.0

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0

  cupertino_icons: ^1.0.8
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true